    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        gold: '#d4af37',
                        emerald: '#10b981',
                        crimson: '#ef4444',
                        sapphire: '#3b82f6',
                        glass: {
                            100: 'rgba(255, 255, 255, 0.1)',
                            200: 'rgba(17, 24, 39, 0.7)', // Dark glass
                            300: 'rgba(17, 24, 39, 0.85)', // Darker glass
                        }
                    }
                }
            }
        }

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(212,175,55,0.8); }
        
        /* Checkbox Styling */
        .jira-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            background: rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .jira-checkbox:checked {
            background: #10b981;
            border-color: #10b981;
        }
        .jira-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 12px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Glass Panel Utility */
        .glass-panel {
            background: var(--tw-colors-glass-200);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

        // --- Render Logic ---
        function updateDashboard(teamKey) {
            const data = franchiseData[teamKey];
            if(!data) return;

            // Update Background Engine
            document.getElementById('bg-image').style.backgroundImage = `url('${data.bgImage}')`;
            
            // Update Header Logo
            document.getElementById('header-logo').src = `https://ui-avatars.com/api/?name=${data.logoInitials}&background=${data.logoColor}&color=fff&bold=true`;

            // Update Briefing (Bullet points)
            const briefingHtml = data.briefing.map(point => `<p class="flex items-start"><i class="ph-fill ph-caret-right text-gold mt-1 mr-2 shrink-0"></i> <span>${point}</span></p>`).join('');
            document.getElementById('briefing-content').innerHTML = briefingHtml;

            // Update KPIs
            const updateKpi = (num, kpiData) => {
                document.getElementById(`kpi${num}-title`).innerText = kpiData.title;
                document.getElementById(`kpi${num}-value`).innerText = kpiData.val;
                document.getElementById(`kpi${num}-status`).innerText = kpiData.status;
                
                // Color formatting
                const card = document.getElementById(`kpi${num}-title`).parentElement.parentElement;
                card.className = `glass-panel p-5 rounded-xl border-l-4 border-l-${kpiData.color} hover:bg-white/[0.02] transition-all duration-300 relative group`;
                
                const icon = document.getElementById(`kpi${num}-icon`);
                icon.className = `ph-fill ${kpiData.icon} text-${kpiData.color} mr-1.5 mt-0.5 shrink-0`;
            };

            updateKpi(1, data.kpi1);
            updateKpi(2, data.kpi2);
            updateKpi(3, data.kpi3);
            updateKpi(4, data.kpi4);

            // Update Jira Action Register
            const tbody = document.getElementById('actions-tbody');
            tbody.innerHTML = '';
            data.actions.forEach(a => {
                tbody.innerHTML += `
                    <tr class="border-b border-white/5 hover:bg-white/[0.03] transition-colors group">
                        <td class="py-3 px-4 text-center">
                            <input type="checkbox" class="jira-checkbox">
                        </td>
                        <td class="py-3 px-4">
                            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold border ${a.prioColor}">
                                ${a.priority}
                            </span>
                        </td>
                        <td class="py-3 px-4">
                            <div class="text-gray-200 font-medium text-xs mb-0.5 group-hover:text-gold transition-colors cursor-pointer">${a.task}</div>
                            <div class="text-[10px] text-gray-500 font-mono">${a.id} • Cross-Functional</div>
                        </td>
                        <td class="py-3 px-4 text-center">
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium ${a.statusColor}">
                                ${a.status}
                            </span>
                        </td>
                        <td class="py-3 px-4 text-center">
                            <div class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-gray-700 border border-gray-500 text-[10px] text-white font-bold" title="Assignee: ${a.assignee}">
                                ${a.assignee}
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        // Initialize with default
        document.addEventListener("DOMContentLoaded", () => updateDashboard('como'));
    </script>
</body>
</html>
